<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>计算器</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .calc {
    width: min(420px, 100vw, 60vh);
    height: 100vh;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    padding: 0 10px 14px;
    background: #000;
    position: relative;
  }

  /* ---------- 顶部栏（时钟 / 计算器） ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 12px 0;
    height: 78px;
    flex-shrink: 0;
  }

  .top-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #2C2C2E;
    color: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: filter .12s, transform .08s;
    padding: 0;
  }

  .top-btn:hover { filter: brightness(1.2); }
  .top-btn:active { filter: brightness(1.4); transform: scale(0.94); }

  .top-btn.active { background: #FF9F0A; color: #000; }

  .top-btn svg { width: 26px; height: 26px; }

  /* ---------- 历史记录面板 ---------- */
  .history-panel {
    position: absolute;
    top: 84px;
    left: 12px;
    right: 12px;
    background: #1C1C1E;
    border-radius: 16px;
    padding: 16px 18px;
    z-index: 20;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    opacity: 0;
    transform: translateY(-10px);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    max-height: 260px;
    overflow-y: auto;
  }

  .history-panel.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .history-title {
    color: #8E8E93;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .history-empty {
    color: #48484A;
    font-size: 15px;
    text-align: center;
    padding: 12px 0;
  }

  .history-item {
    color: #fff;
    font-size: 18px;
    font-weight: 300;
    text-align: right;
    padding: 6px 0;
    border-bottom: 1px solid #2C2C2E;
  }

  .history-item:last-child { border-bottom: none; }

  .history-item .hi-expr {
    color: #8E8E93;
    font-size: 13px;
    display: block;
    margin-bottom: 2px;
  }

  /* ---------- 显示区 ---------- */
  .screen {
    flex: 1;
    min-height: 100px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    padding: 12px 10px 22px;
    gap: 6px;
  }

  /* 小字：计算过程 */
  .expression {
    color: #8E8E93;
    font-size: 23px;
    font-weight: 300;
    letter-spacing: -0.3px;
    line-height: 1.2;
    min-height: 27px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 大字：当前数字 */
  .result {
    color: #fff;
    font-size: 90px;
    font-weight: 200;
    letter-spacing: -2.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: font-size .12s ease-out;
    white-space: nowrap;
    overflow: hidden;
  }

  /* 右上角隐形热区（三连击） */
  .hotspot {
    position: absolute;
    top: 0;
    right: 0;
    width: 78px;
    height: 78px;
    z-index: 5;
  }

  /* ---------- 键盘 ---------- */
  .pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 11px;
    flex-shrink: 0;
  }

  .btn {
    aspect-ratio: 1;
    border: none;
    border-radius: 50%;
    background: #333336;
    color: #fff;
    font-size: 35px;
    font-weight: 400;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter .1s, background .15s, color .15s, transform .08s;
    outline: none;
    padding: 0;
  }

  .btn:active { filter: brightness(1.4); transform: scale(0.96); }

  .btn.fn {
    background: #A5A5A5;
    color: #000;
    font-size: 31px;
    font-weight: 400;
  }

  .btn.op {
    background: #FF9F0A;
    font-size: 43px;
    font-weight: 300;
  }

  .btn.op.active {
    background: #fff;
    color: #FF9F0A;
  }

  .btn svg { width: 30px; height: 30px; }
</style>
</head>
<body>

<div class="calc">
  <div class="topbar">
    <button class="top-btn" id="clockBtn" aria-label="历史记录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <polyline points="12 7 12 12 15.5 14.5"></polyline>
      </svg>
    </button>
    <button class="top-btn active" id="calcBtn" aria-label="计算器">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2.5" width="14" height="19" rx="2.5"></rect>
        <rect x="8" y="5.5" width="8" height="3" rx="0.5"></rect>
        <circle cx="9"  cy="12"   r="0.7" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12"   r="0.7" fill="currentColor" stroke="none"></circle>
        <circle cx="15" cy="12"   r="0.7" fill="currentColor" stroke="none"></circle>
        <circle cx="9"  cy="15.5" r="0.7" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="15.5" r="0.7" fill="currentColor" stroke="none"></circle>
        <circle cx="15" cy="15.5" r="0.7" fill="currentColor" stroke="none"></circle>
        <circle cx="9"  cy="19"   r="0.7" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="19"   r="0.7" fill="currentColor" stroke="none"></circle>
        <circle cx="15" cy="19"   r="0.7" fill="currentColor" stroke="none"></circle>
      </svg>
    </button>
  </div>

  <div class="history-panel" id="historyPanel">
    <div class="history-title">历史记录</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">暂无记录</div>
    </div>
  </div>

  <div class="screen">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
    <div class="hotspot" id="hotspot"></div>
  </div>

  <div class="pad" id="pad">
    <button class="btn fn" data-action="backspace" aria-label="退格">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
        <line x1="17" y1="9.5" x2="11.5" y2="14.5"></line>
        <line x1="11.5" y1="9.5" x2="17" y2="14.5"></line>
      </svg>
    </button>
    <button class="btn fn" data-action="clear" id="clearBtn">AC</button>
    <button class="btn fn" data-action="percent">%</button>
    <button class="btn op" data-op="÷">÷</button>

    <button class="btn num" data-num="7">7</button>
    <button class="btn num" data-num="8">8</button>
    <button class="btn num" data-num="9">9</button>
    <button class="btn op" data-op="×">×</button>

    <button class="btn num" data-num="4">4</button>
    <button class="btn num" data-num="5">5</button>
    <button class="btn num" data-num="6">6</button>
    <button class="btn op" data-op="-">−</button>

    <button class="btn num" data-num="1">1</button>
    <button class="btn num" data-num="2">2</button>
    <button class="btn num" data-num="3">3</button>
    <button class="btn op" data-op="+">+</button>

    <button class="btn" data-action="negate">+/−</button>
    <button class="btn num" data-num="0">0</button>
    <button class="btn num" data-action="decimal">.</button>
    <button class="btn op" data-action="equals">=</button>
  </div>
</div>

<script>
/* =========================================================
   常规计算器状态
   ========================================================= */
let displayValue      = '0';
let accumulator       = null;
let pendingOp         = null;
let waitingForOperand = false;
let justEvaluated     = false;
let expressionValue   = '';

/* =========================================================
   历史记录
   ========================================================= */
const history = [];  // [{expr: '123+456', result: '579'}]

function pushHistory(expr, res) {
  history.unshift({ expr, result: res });
  if (history.length > 20) history.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">暂无记录</div>';
    return;
  }
  list.innerHTML = history.map(h =>
    `<div class="history-item"><span class="hi-expr">${h.expr}</span>${h.result}</div>`
  ).join('');
}

/* =========================================================
   魔术状态
   ========================================================= */
const magic = {
  on: false,
  phase: 0,
  first: null,
  second: null,
  locked: false
};
let magicCurrentDigitIndex = -1;

function magicReset() {
  magic.phase  = 0;
  magic.first  = null;
  magic.second = null;
  magic.locked = false;
  magicCurrentDigitIndex = -1;
}

/* =========================================================
   DOM
   ========================================================= */
const resultEl     = document.getElementById('result');
const expressionEl = document.getElementById('expression');
const padEl        = document.getElementById('pad');
const hotspot      = document.getElementById('hotspot');
const clearBtn     = document.getElementById('clearBtn');
const clockBtn     = document.getElementById('clockBtn');
const calcBtn      = document.getElementById('calcBtn');
const historyPanel = document.getElementById('historyPanel');

/* =========================================================
   工具函数
   ========================================================= */
function numToStr(n) {
  if (!isFinite(n)) return 'Error';
  const r = Math.round(n * 1e9) / 1e9;
  return String(r);
}

function formatDisplay(str) {
  if (str === 'Error') return '错误';
  const neg = str.startsWith('-');
  const s = neg ? str.slice(1) : str;
  const parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + parts.join('.');
}

function currentNumber() {
  const n = parseFloat(displayValue.replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}

function compute(a, op, b) {
  switch (op) {
    case '+': return a + b;
    case '-': return a - b;
    case '×': return a * b;
    case '÷': return b === 0 ? NaN : a / b;
  }
  return b;
}

/* =========================================================
   渲染
   ========================================================= */
function render() {
  expressionEl.textContent = expressionValue;

  const text = formatDisplay(displayValue);
  resultEl.textContent = text;

  const len = text.length;
  const size = Math.max(36, Math.min(90, Math.floor(340 / (len * 0.55))));
  resultEl.style.fontSize = size + 'px';

  document.querySelectorAll('.btn.op').forEach(b => {
    const on = waitingForOperand && pendingOp !== null && b.dataset.op === pendingOp;
    b.classList.toggle('active', on);
  });

  const dirty = displayValue !== '0' || accumulator !== null || pendingOp !== null;
  clearBtn.textContent = dirty ? 'C' : 'AC';
}

/* =========================================================
   按键逻辑
   ========================================================= */
function pressDigit(d) {
  /* —— 魔术第三阶段：逐位蹦出目标数字 —— */
  if (magic.on && magic.phase >= 2) {
    if (!magic.locked) {
      const targetStr = numToStr(2027 - (magic.first || 0) - (magic.second || 0));

      if (magicCurrentDigitIndex === -1) {
        if (targetStr.startsWith('-')) {
          displayValue = '-';
          magicCurrentDigitIndex = 1;
        } else {
          displayValue = '';
          magicCurrentDigitIndex = 0;
        }
      }

      if (magicCurrentDigitIndex < targetStr.length) {
        displayValue += targetStr[magicCurrentDigitIndex];
        magicCurrentDigitIndex++;
      }

      if (magicCurrentDigitIndex >= targetStr.length) {
        magic.locked = true;
      }

      waitingForOperand = false;
      justEvaluated = false;
    }
    return;
  }

  /* —— 常规数字输入 —— */
  if (displayValue === 'Error' || justEvaluated || waitingForOperand) {
    displayValue      = d;
    waitingForOperand = false;
    justEvaluated     = false;
  } else if (displayValue === '0') {
    displayValue = d;
  } else if (displayValue.replace(/[-.,]/g, '').length < 9) {
    displayValue += d;
  }
}

function pressDecimal() {
  if (magic.on && magic.phase >= 2) return;

  if (waitingForOperand || justEvaluated) {
    displayValue      = '0.';
    waitingForOperand = false;
    justEvaluated     = false;
  } else if (!displayValue.includes('.')) {
    displayValue += '.';
  }
}

function pressOperator(op) {
  if (magic.on && magic.phase >= 2) return;

  if (magic.on && magic.phase === 0) {
    magic.first = currentNumber();
    magic.phase = 1;
  }

  const value = currentNumber();
  if (accumulator === null) {
    accumulator = value;
  } else if (pendingOp !== null && !waitingForOperand) {
    const r = compute(accumulator, pendingOp, value);
    accumulator  = r;
    displayValue = numToStr(r);
  }
  pendingOp          = op;
  waitingForOperand  = true;
  justEvaluated      = false;

  expressionValue = formatDisplay(numToStr(accumulator)) + op;
}

function pressEquals() {
  /* —— 魔术第二阶段：观众按 =，记录第二个数 —— */
  if (magic.on && magic.phase === 1 && magic.second === null) {
    magic.second = currentNumber();
    magic.phase = 2;
    magic.locked = false;
    magicCurrentDigitIndex = -1;

    if (pendingOp !== null && accumulator !== null && !waitingForOperand) {
      const prev = accumulator;
      const cur  = currentNumber();
      const r = compute(accumulator, pendingOp, cur);

      displayValue    = numToStr(r);
      expressionValue = formatDisplay(numToStr(prev)) + pendingOp + formatDisplay(numToStr(cur));

      pushHistory(expressionValue, formatDisplay(numToStr(r)));

      accumulator       = null;
      pendingOp         = null;
      waitingForOperand = true;
      justEvaluated     = true;
    }
    return;
  }

  /* —— 魔术第三阶段：显示最终 2027 —— */
  if (magic.on && magic.phase >= 2) {
    if (!magic.locked) {
      magic.locked = true;
      const targetStr = numToStr(2027 - (magic.first || 0) - (magic.second || 0));
      displayValue = targetStr;
      magicCurrentDigitIndex = targetStr.length;
    }

    const first  = magic.first || 0;
    const second = magic.second || 0;
    const third  = 2027 - first - second;

    displayValue = '2027';

    let expr = formatDisplay(numToStr(first)) + '+' + formatDisplay(numToStr(second));
    if (third < 0) {
      expr += '-' + formatDisplay(numToStr(Math.abs(third)));
    } else {
      expr += '+' + formatDisplay(numToStr(third));
    }
    expressionValue = expr;

    pushHistory(expressionValue, '2,027');

    accumulator       = null;
    pendingOp         = null;
    waitingForOperand = true;
    justEvaluated     = true;
    magicReset();
    return;
  }

  /* —— 常规等于 —— */
  if (pendingOp !== null && accumulator !== null && !waitingForOperand) {
    const prev = accumulator;
    const cur  = currentNumber();
    const r = compute(accumulator, pendingOp, cur);

    displayValue    = numToStr(r);
    expressionValue = formatDisplay(numToStr(prev)) + pendingOp + formatDisplay(numToStr(cur));

    pushHistory(expressionValue, formatDisplay(numToStr(r)));

    accumulator       = null;
    pendingOp         = null;
    waitingForOperand = true;
    justEvaluated     = true;
  }
}

function pressClear() {
  displayValue      = '0';
  accumulator       = null;
  pendingOp         = null;
  waitingForOperand = false;
  justEvaluated     = false;
  expressionValue   = '';
  magicReset();
}

function pressNegate() {
  if (magic.on && magic.phase >= 2) return;
  if (displayValue === '0' || displayValue === 'Error') return;
  displayValue = displayValue.startsWith('-')
    ? displayValue.slice(1)
    : '-' + displayValue;
}

function pressPercent() {
  if (magic.on && magic.phase >= 2) return;
  const v = currentNumber();
  displayValue = numToStr(v / 100);
}

function pressBackspace() {
  if (magic.on && magic.phase >= 2) return;

  if (waitingForOperand || justEvaluated || displayValue === 'Error') {
    displayValue = '0';
    justEvaluated = false;
    waitingForOperand = false;
    return;
  }

  displayValue = displayValue.slice(0, -1);
  if (displayValue === '' || displayValue === '-') displayValue = '0';
}

/* =========================================================
   事件分发
   ========================================================= */
function handleKey(btn) {
  const { num, op, action } = btn.dataset;

  if (num !== undefined)           pressDigit(num);
  else if (op !== undefined)       pressOperator(op);
  else if (action === 'equals')    pressEquals();
  else if (action === 'clear')     pressClear();
  else if (action === 'negate')    pressNegate();
  else if (action === 'percent')   pressPercent();
  else if (action === 'decimal')   pressDecimal();
  else if (action === 'backspace') pressBackspace();

  render();
}

padEl.addEventListener('click', e => {
  const btn = e.target.closest('.btn');
  if (!btn) return;
  handleKey(btn);
});

/* =========================================================
   顶部栏按钮
   ========================================================= */
clockBtn.addEventListener('click', e => {
  e.stopPropagation();
  historyPanel.classList.toggle('show');
});

calcBtn.addEventListener('click', e => {
  e.stopPropagation();
  // 仅作视觉反馈，切换高亮状态
  calcBtn.classList.toggle('active');
});

/* 点击其他地方关闭历史记录面板 */
document.addEventListener('click', e => {
  if (!historyPanel.contains(e.target) && e.target !== clockBtn && !clockBtn.contains(e.target)) {
    historyPanel.classList.remove('show');
  }
});

/* =========================================================
   右上角三连击 → 开启/关闭魔术模式（无弹窗）
   ========================================================= */
let tapTimes = [];

hotspot.addEventListener('click', e => {
  e.stopPropagation();
  const now = Date.now();
  tapTimes = tapTimes.filter(t => now - t < 800);
  tapTimes.push(now);

  if (tapTimes.length >= 3) {
    tapTimes = [];
    magic.on = !magic.on;
    magicReset();
  }
});

/* =========================================================
   启动
   ========================================================= */
render();
renderHistory();
</script>
</body>
</html>
